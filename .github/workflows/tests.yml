name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5" # weekdays 09:00 UTC: catch changes in the site under test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude root-cause analysis runs only when the secret is configured.
          AI_FLAG: ${{ secrets.ANTHROPIC_API_KEY != '' && '--ai-analysis' || '' }}
        run: >
          pytest
          --browser ${{ matrix.browser }}
          -n auto
          --reruns 1 --reruns-delay 2
          --tracing retain-on-failure
          --screenshot only-on-failure
          --video retain-on-failure
          $AI_FLAG

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 14

      - name: Upload Playwright traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: test-results
          retention-days: 14

  report:
    needs: test
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results from all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Checkout previous report (for trend history)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Add history, categories and environment
        run: |
          cp -r gh-pages/history allure-results/ 2>/dev/null || true
          cp config/allure_categories.json allure-results/categories.json
          cat > allure-results/environment.properties <<PROPS
          Base.URL=https://www.saucedemo.com
          Browsers=chromium, firefox, webkit
          Python=3.11
          Commit=${GITHUB_SHA::7}
          PROPS
          cat > allure-results/executor.json <<JSON
          {"name": "GitHub Actions", "type": "github", "buildName": "Run #${{ github.run_number }}",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"}
          JSON

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline@2
          allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
