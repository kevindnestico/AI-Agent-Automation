[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .

# Target environment (override with --base-url or PYTEST_BASE_URL)
base_url = https://www.saucedemo.com

markers =
    smoke: Quick smoke tests for critical functionality
    regression: Full regression test suite
    known_bug: Documents a known defect of a Saucedemo test user (expected to fail)
    user(name): Log in as this user in the logged_in_page fixture
    visual: Visual regression tests (screenshot comparison)
    a11y: Accessibility checks with axe-core
    unit: Fast unit tests without a browser

addopts =
    --strict-markers
    --tb=short
    --alluredir=allure-results
    --clean-alluredir

# A known bug that suddenly "passes" must be reviewed, not silently ignored.
xfail_strict = true

console_output_style = progress
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
